<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>분수 익히기 · 차근차근 분수 교실</title>
<meta name="description" content="피자와 초콜릿 애니메이션으로 분수의 뜻부터 사칙연산까지 익히는 웹 학습지">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍕</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <button class="brand" id="btnHome" aria-label="첫 화면으로"><span class="logo">½</span><span>분수 익히기</span></button>
    <nav class="tools" aria-label="도구">
      <div class="grp" title="글자 크기"><button id="fsDown" aria-label="글자 작게">가<small>−</small></button><button id="fsUp" aria-label="글자 크게"><b>가</b><small>+</small></button></div>
      <div class="grp" title="화면 크기"><button id="zmDown" aria-label="화면 작게">🔍<small>−</small></button><button id="zmUp" aria-label="화면 크게">🔍<small>+</small></button></div>
      <button class="tool" id="btnVoice">🔊 여자 목소리</button>
      <button class="tool" id="btnPrint">🖨 문제 출력</button>
      <button class="tool" id="btnSettings">⚙ 설정</button>
    </nav>
  </header>
  <main id="view"></main>
</div>
<div id="modalRoot"></div>
<div id="printSheet"></div>

<!-- 오픈소스 라이브러리 (libs 폴더에 함께 들어 있어 인터넷 없이도 동작) -->
<script src="libs/fraction.min.js"></script>
<script src="libs/anime.min.js"></script>
<script src="libs/confetti.browser.min.js"></script>
<script src="js/util.js"></script>
<script src="js/voice.js"></script>
<script src="js/recognizer.js"></script>
<script src="js/scene.js"></script>
<script src="js/problems.js"></script>
<script src="js/app.js"></script>
</body>
</html>
